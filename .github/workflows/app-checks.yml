name: app-checks

on:
  push:
    paths:
      - '03-fly8-study-nursing-app/app/**'
      - '.github/workflows/app-checks.yml'
  pull_request:
    paths:
      - '03-fly8-study-nursing-app/app/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-fly8-study-nursing-app/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03-fly8-study-nursing-app/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_REQUIRE_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: 03-fly8-study-nursing-app/app/.expo/e2e-failures
          if-no-files-found: ignore
